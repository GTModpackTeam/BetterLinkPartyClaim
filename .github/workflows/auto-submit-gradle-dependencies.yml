name: Automatic Dependency Submission

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: auto-submit-gradle-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-gradle:
    uses: gradle/actions/auto-submit-gradle-dependencies@v6
    with:
      java-version: 25
